
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>VideoIA - Crée tes vidéos</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b1020;color:#f8fafc;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
main{max-width:600px;margin:auto;padding:24px 18px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.logo{background:#6366f1;padding:12px;border-radius:14px;font-size:24px}
h1{font-size:25px;margin:0}
.sub{color:#a5b4fc;font-size:13px;margin-top:5px}
.intro{font-size:27px;font-weight:750;line-height:1.2}
.muted{color:#a1a1aa;line-height:1.6}
.card{
  background:#151c30;border:1px solid #29334d;
  padding:18px;border-radius:18px;margin-top:18px;
}
label{display:block;font-weight:650;margin-bottom:12px}
.upload{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:170px;border:2px dashed #4b5680;
  border-radius:14px;text-align:center;padding:15px;cursor:pointer;
}
.upload span{font-size:36px;margin-bottom:8px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
#preview{width:100%;max-height:320px;object-fit:contain;
  margin-top:14px;border-radius:12px;display:none}
textarea,select{
  width:100%;background:#0b1020;color:white;border:1px solid #39435d;
  border-radius:12px;padding:13px;font:inherit;
}
textarea{min-height:110px;resize:vertical}
select{margin-top:14px}
button{
  width:100%;border:0;border-radius:13px;padding:16px;
  background:#6366f1;color:white;font-size:16px;font-weight:700;
  margin-top:18px;cursor:pointer;
}
button:active{opacity:.8}
#status{font-size:14px;line-height:1.6;margin-top:15px;color:#c7d2fe}
footer{font-size:12px;color:#717b95;text-align:center;margin-top:26px}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo">🎬</div>
    <div>
      <h1>VideoIA</h1>
      <div class="sub">Tes images, animées par l'IA</div>
    </div>
  </header>

  <div class="intro">Donne vie à tes photos.</div>
  <p class="muted">
    Importe une image, décris les mouvements et prépare ta création vidéo.
  </p>

  <section class="card">
    <label for="image">1. Choisis ton image</label>
    <label class="upload" for="image">
      <span>🖼️</span>
      <strong>Appuie pour importer une photo</strong>
      <small class="muted">Choisis une image dans tes fichiers ou photos</small>
    </label>
    <input id="image" type="file" accept="image/*">
    <img id="preview" alt="Aperçu de ta photo">
  </section>

  <section class="card">
    <label for="prompt">2. Décris ta vidéo</label>
    <textarea id="prompt" placeholder="Ex. : Anime les personnages, fais-les marcher, sourire et bouger naturellement."></textarea>

    <label for="format" style="margin-top:18px">3. Format de la vidéo</label>
    <select id="format">
      <option value="16:9">Paysage — 16:9</option>
      <option value="9:16">Portrait — 9:16</option>
      <option value="1:1">Carré — 1:1</option>
    </select>

    <button id="generate">Préparer ma vidéo IA</button>
    <div id="status" role="status">
      Prêt à commencer. Sélectionne une image.
    </div>
  </section>

  <footer>
    VideoIA · Prototype web · La génération IA sera connectée dans une prochaine étape.
  </footer>
</main>

<script>
const imageInput = document.getElementById("image");
const preview = document.getElementById("preview");
const promptInput = document.getElementById("prompt");
const formatInput = document.getElementById("format");
const statusBox = document.getElementById("status");
let imageUrl = null;

imageInput.addEventListener("change", () => {
  const file = imageInput.files[0];
  if (!file) return;

  if (imageUrl) URL.revokeObjectURL(imageUrl);
  imageUrl = URL.createObjectURL(file);
  preview.src = imageUrl;
  preview.style.display = "block";
  statusBox.textContent = "Image importée. Décris maintenant l'animation souhaitée.";
});

document.getElementById("generate").addEventListener("click", () => {
  if (!imageInput.files.length) {
    statusBox.textContent = "Choisis d'abord une image.";
    return;
  }
  if (!promptInput.value.trim()) {
    statusBox.textContent = "Écris une description de la vidéo.";
    promptInput.focus();
    return;
  }

  statusBox.textContent =
    "Ta demande est prête ! Le moteur de génération vidéo IA n'est pas encore connecté. Cette étape sera ajoutée ensuite.";
});
</script>
</body>
</html>
